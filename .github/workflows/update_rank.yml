name: Update Ranking (auto)

on:
  schedule:
    - cron: "0 * * * *"   # 毎時00分（UTC基準）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-ranking-main
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    env:
      TZ: Asia/Tokyo
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -fv

      - name: Force Matplotlib to use Noto CJK
        run: |
          rm -rf ~/.cache/matplotlib
          mkdir -p .mplconfig
          cat > .mplconfig/matplotlibrc << 'EOF'
          font.family: sans-serif
          font.sans-serif: Noto Sans CJK JP, DejaVu Sans
          axes.unicode_minus: False
          EOF
          echo "MPLCONFIGDIR=${GITHUB_WORKSPACE}/.mplconfig" >> $GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install pandas matplotlib requests beautifulsoup4 pillow
          fi

      - name: Clean generated files
        run: |
          rm -rf rank_plots rank_text
          rm -f rank_latest_view.html

      - name: Run ranking scripts (same as Mac)
        run: |
          python fetch_rank.py
          python plot_rank_per_shop.py
          python make_text_summary.py
          python make_latest_view.py

      - name: Commit & Push (safe rebase + retry)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi

          git add -A
          git commit -m "Update ranking (GitHub Actions)" || true

          git pull --rebase origin main

          for i in 1 2 3; do
            if git push origin main; then
              echo "Pushed."
              exit 0
            fi
            echo "Push failed. Retry $i..."
            git pull --rebase origin main
            sleep 3
          done

          echo "Push failed after retries."
          exit 1
